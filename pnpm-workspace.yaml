packages:
    - 'packages/*'
    - 'libs/*'

# pnpm 11+ reads every setting below only from this file, not from package.json's "pnpm" field

# Install scripts of dependencies; pnpm 11+ fails the install on any not listed
allowBuilds:
    # checks its platform binary and speeds up its CLI
    'esbuild': true
    # only falls back to a WebAssembly build when the native binding is missing
    '@swc/core': false
    # prints a funding banner
    'core-js': false
    # prints a message for installs in some time zones
    'es5-ext': false
    # installs git hooks; the root "prepare" script already runs lefthook install
    'lefthook': false
    # only manages npm's global yarn shims
    'yarn': false

minimumReleaseAgeExclude:
    # Explicitly requested Office releases, published together on November 25.
    - ooxml-core@2.1.0
    - ooxml-ui@2.1.0
    - pptx-react-viewer@5.1.0

overrides:
    # Keep every Office binding and core wrapper on the same validated runtime.
    'ooxml-core': '2.1.0'
    'ooxml-ui': '2.1.0'

patchedDependencies:
    'ooxml-core@2.1.0': 'patches/ooxml-core@2.1.0.patch'
    'ooxml-ui@2.1.0': 'patches/ooxml-ui@2.1.0.patch'
