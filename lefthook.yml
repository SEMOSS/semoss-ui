pre-commit:
  commands:
    check:
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    test:
      run: pnpm exec turbo run test -- --run {staged_files}
      glob: "*.(spec|test).{ts,tsx,js,jsx}"

# pre-push:
#   commands:
#     build:
#       run: pnpm build

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}