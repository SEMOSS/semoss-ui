name: Generate Context Documentation

on:
  pull_request:
    types: [closed]
    branches:
      - dev
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to analyze'
        required: false
        default: 'dev'

jobs:
  generate-context:
    runs-on: ubuntu-latest
    # Only run when PR is actually merged, not just closed
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    
    permissions:
      contents: write
      pull-requests: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate context documentation
        env:
          BRANCH: ${{ github.event.inputs.branch || 'dev' }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha || '' }}
        run: |
          echo "Generating documentation for merged PR #${PR_NUMBER}: ${PR_TITLE}"
          if [ -n "$MERGE_COMMIT" ]; then
            echo "Using merge commit: ${MERGE_COMMIT}"
            node scripts/analyze-commits.js --merge-commit "${MERGE_COMMIT}" --branch "${{ env.BRANCH }}" --output "pr-${PR_NUMBER}-$(date +%Y-%m-%d)"
          else
            node scripts/analyze-commits.js --branch "${{ env.BRANCH }}" --output "manual-$(date +%Y-%m-%d)"
          fi

      - name: Commit context documentation
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if git diff --quiet webapps/documentation/docusaurus/docs/context-logs/; then
            echo "No new context documentation"
          else
            git add webapps/documentation/docusaurus/docs/context-logs/
            git commit -m "docs: generate context documentation for merged PR #${{ github.event.pull_request.number }}" || true
            git push || true
          fi
