    pnpm_build_deploy:
        runs-on: self-hosted
        if: ${{ vars.RELEASE != 'TRUE'  && github.event_name =='workflow_dispatch' }}
        container:
            image: node:18.16.1-bullseye
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # - name: Cache node modules and Maven repository
            #   uses: actions/cache@v4
            #   with:
            #       path: |
            #           node_modules
            #           .m2/repository
            #           dist
            #           index.html
            #       key: ${{ github.ref_name }}

            - name: Delete contents of legacy folder
              run: |
                  echo "Remove and recreate the legacy folder"
                  rm -rf legacy
                  mkdir legacy
                  ls -als

            - name: Download contents of SEMOSS/bi project
              run: |
                  echo "Download SEMOSS/bi as a zip file"
                  mkdir -p tmp
                  curl -L -u "${{ secrets.SEMOSS_GITHUB_USERNAME }}:${{ secrets.SEMOSS_GITHUB_PAT }}" -o tmp/main.zip https://github.com/SEMOSS/bi/archive/refs/heads/main.zip
                  echo "Unzip contents of the SEMOSS/bi to the tmp folder"
                  unzip tmp/main.zip -d tmp/
                  echo "Delete the playsheet folder from semoss/bi files"
                  rm -rf tmp/bi-main/playsheet/
                  ls -als tmp/bi-main/
                  echo "Remove zip file"
                  rm tmp/main.zip
            
            - name: Move SEMOSS/bi files into the legacy folder
              run: |
                  echo "Move contents of SEMOSS/bi into legacy folder"
                  cp -r tmp/bi-main/. legacy/
                  echo "Delete tmp folder"
                  rm -rf tmp/
                  echo "list files under legacy folder"
                  ls -als legacy

            - name: Install dependencies
              run: |
                  echo "Event Name: ${{ github.event_name }}"
                  echo "Release: ${{ vars.RELEASE }}"
                  apt-get update
                  apt-get install -y maven
                  npm install -g pnpm@10.10
                  pnpm install

            - name: Build
              env:
                  NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
              run: npx nx run-many -t build -p @semoss/client @semoss/legacy --verbose

            - name: Deploy with Maven
              shell: bash
              run: |
                  REF_NAME=$( echo $GITHUB_REF | sed 's|refs/heads/||')
                  if [[ "$REF_NAME" != 'dev' && "$REF_NAME" != 'main' ]]; then
                    mvn clean install -DfailIfNoTests=false -Dci.version=${{ vars.VERSION }}-SNAPSHOT
                  elif [[ "$REF_NAME" == 'dev' || "$REF_NAME" == 'main' ]]; then
                    mvn $MAVEN_CLI_OPTS deploy -P deploy -Dci.version=${{ vars.VERSION }}-SNAPSHOT
                  fi
              env:
                  GITHUB_REF: ${{ github.ref }}

            - name: Remove cache to save space
              run: rm -rf .m2/repository/org/semoss

            - name: Upload WAR to Nexus
              if: github.ref_name != 'dev' && github.ref_name != 'main'
              env:
                  NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
                  NEUXS_PASSWORD: ${{secrets.NEUXS_PASSWORD }}
                  GITHUB_REF: ${{ github.ref }}
              run: |
                  REF_NAME=$( echo $GITHUB_REF | sed 's|refs/heads/||')
                  WAR_FILE=$(ls target/*.war | head -n 1)
                  if [ -f "$WAR_FILE" ]; then
                    echo "Uploading WAR file: (basename $WAR_FILE)"
                    curl -v -u "$NEXUS_USERNAME:$NEUXS_PASSWORD" \
                    --upload-file "$WAR_FILE" \
                    "https://artifact.semoss.org/repository/semoss-ui-hosted-repo/$REF_NAME/$(basename $WAR_FILE)"
                  else
                    echo "No WAR file found in the target directory."
                  fi

            # - name: Save artifacts
            #   if: success()
            #   uses: actions/upload-artifact@v4
            #   with:
            #       name: semossweb-artifact
            #       path: target/semossweb-${{ vars.VERSION }}-SNAPSHOT.war

            # - name: Delete old artifacts
            #   run: |
            #     echo "Deleting old artifacts..."
            #     ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            #       "https://api.github.com/repos/${{ github.repository }}/actions/artifacts" | jq -r '.artifacts | sort_by(.created_at) | reverse | .[1:] | .[].id')
            #     for ARTIFACT_ID in $ARTIFACTS; do
            #       curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            #         "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID"
            #     done
            #   env:
            #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    pnpm_build_release:
        runs-on: self-hosted
        if: ${{ vars.RELEASE == 'TRUE' && github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'dev') }}
        container:
            image: node:18.16.1-bullseye
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install dependencies
              run: |
                  echo "Event Name: ${{ github.event_name }}"
                  echo "Release: ${{ vars.RELEASE }}"
                  apt-get update
                  apt-get install -y maven
                  npm install -g pnpm@10.10
                  pnpm install

            - name: Build
              env:
                  NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
              run: npx nx run-many -t build -p @semoss/client @semoss/legacy --verbose

            - name: Download contents of SEMOSS/bi project
              run: |
                  echo "Download SEMOSS/bi as a zip file"
                  mkdir -p tmp
                  curl -L -u "${{ secrets.SEMOSS_GITHUB_USERNAME }}:${{ secrets.SEMOSS_GITHUB_PAT }}" -o tmp/main.zip https://github.com/SEMOSS/bi/archive/refs/heads/main.zip
                  echo "Unzip contents of the SEMOSS/bi to the tmp folder"
                  unzip tmp/main.zip -d tmp/
                  echo "Delete the playsheet folder from semoss/bi files"
                  rm -rf tmp/bi-main/playsheet/
                  ls -als tmp/bi-main/
                  echo "Remove zip file"
                  rm tmp/main.zip
            
            - name: Move SEMOSS/bi files into the legacy folder
              run: |
                  echo "Move contents of SEMOSS/bi into legacy folder"
                  cp -r tmp/bi-main/. legacy/
                  echo "Delete tmp folder"
                  rm -rf tmp/
                  echo "list files under legacy folder"
                  ls -als legacy

            - name: Install dependencies
              run: |
                  echo "Event Name: ${{ github.event_name }}"
                  echo "Release: ${{ vars.RELEASE }}"
                  apt-get update
                  apt-get install -y maven
                  npm install -g pnpm@10.10
                  pnpm install
                  
            - name: Deploy with Maven
              shell: bash
              run: |
                  mvn $MAVEN_CLI_OPTS deploy -P deploy -Dci.version=${{ vars.VERSION }}
              env:
                  GITHUB_REF: ${{ github.ref }}

            - name: Remove cache to save space
              run: rm -rf .m2/repository/org/semoss
