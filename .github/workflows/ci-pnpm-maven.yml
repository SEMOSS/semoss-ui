name: CI
on:
    push:
        branches:
            - dev
            - main
    pull_request:
        branches:
            - dev
            - main
    workflow_dispatch:

env:
    MAVEN_OPTS: '-Dmaven.repo.local=.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true'
    MAVEN_CLI_OPTS: '-s ./settings.xml --batch-mode'
    FF_USE_FASTZIP: 'true'
    GPG_PASS_PHRASE: ${{ secrets.GPG_PASS_PHRASE }}
    MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASS_PHRASE }}
    RELEASE: ${{ vars.RELEASE }}
    MAVEN_REPO_TOKEN: ${{ vars.MAVEN_REPO_TOKEN }}
    MAVEN_REPO_TOKEN_PASS: ${{ vars.MAVEN_REPO_TOKEN_PASS }}
    MAVEN_CENTRAL_PORTAL_REPO_USERNAME: ${{ vars.MAVEN_CENTRAL_PORTAL_REPO_USERNAME }}
    MAVEN_CENTRAL_PORTAL_REPO_PASSWORD: ${{ vars.MAVEN_CENTRAL_PORTAL_REPO_PASSWORD }}
    
jobs:
    pnpm_build_dev:
        runs-on: codebuild-semoss-github-runner-${{ github.run_id }}-${{ github.run_attempt }}
        if: ${{ vars.RELEASE != 'TRUE'  && (github.event_name =='push' || github.event_name =='pull_request')  }}
        container:
            image: public.ecr.aws/docker/library/node:24-bookworm
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install maven
              run: |
                  apt-get update
                  apt-get install -y maven
            
            - name: Install n (Node version manager)
              run: npm install -g n

            # ---------- Build semoss-ui (Node 24) -----------                
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 10.13.1

            - name: Install pnpm dependencies
              run: |
                node -v
                pnpm install --ignore-scripts

            - name: Build Component Library
              run: |
                cd libs/ui
                pnpm run build

            - name: Build SDK
              run: |
                cd libs/sdk
                pnpm run build    

            - name: Build Renderer Library
              run: |
                cd libs/renderer
                pnpm run build

            - name: Build semoss-ui
              run: |
                cd packages/client
                pnpm run build

            - name: Build playground
              run: |
                cd packages/playground
                pnpm run build

            - name: Build terminal
              run: |
                cd packages/terminal
                pnpm run build

            - name: Build browser automation
              run: |
                cd packages/browser-automation
                pnpm run build

            # ---------- Download and Set Up semoss/bi -----------
            
            - name: Remove previous legacy folder
              run: rm -rf packages/legacy

            - name: Install jq
              run: apt-get update && apt-get install -y jq
            
            # Share the artifact selection and diagnostics across all three jobs.
            - &download_bi_artifact
              name: Download verified BI build artifact
              shell: bash
              env:
                GH_TOKEN: ${{ secrets.SEMOSS_GITHUB_PAT }}
              run: |
                set -euo pipefail
                REPO="SEMOSS/bi"
                ARTIFACT_NAME="bi-build"
                API="https://api.github.com/repos/$REPO/actions"

                if [[ -z "${GH_TOKEN:-}" ]]; then
                  echo "::error::SEMOSS_GITHUB_PAT is missing; BI artifact access requires Actions read permission on $REPO."
                  exit 1
                fi

                DOWNLOAD_DIR=$(mktemp -d)
                trap 'rm -rf "$DOWNLOAD_DIR"' EXIT

                # Keep HTTP failures out of artifact.zip and log only safe response metadata.
                request() {
                  local url="$1" output="$2" status rc=0
                  status=$(curl --silent --show-error --fail-with-body --location \
                    --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    --dump-header "$DOWNLOAD_DIR/headers" --output "$output" \
                    --write-out '%{http_code}' "$url") || rc=$?
                  echo "GET $url: HTTP $status (curl exit $rc)"
                  # Never print Authorization headers or signed download redirect URLs.
                  awk 'tolower($0) ~ /^(x-github-request-id|x-ratelimit-remaining|x-ratelimit-reset|retry-after|content-type):/ {sub(/\r$/, ""); print}' "$DOWNLOAD_DIR/headers"
                  if [[ "$rc" -ne 0 || "$status" != 200 ]]; then
                    echo "::error::BI artifact request failed: HTTP $status (curl exit $rc)."
                    jq -r '"GitHub message: \(.message // "No JSON error message")"' "$output" 2>/dev/null || true
                    case "$status" in
                      401|403|404) echo "Check SEMOSS_GITHUB_PAT access to $REPO, Actions read permission, SSO authorization, and rate limits." ;;
                      410) echo "The selected artifact expired or was deleted; rerun the BI build and retry." ;;
                    esac
                    return 1
                  fi
                }

                # Discover the actual artifact, rather than assuming the newest run has one.
                # Bound the search to the newest 1,000 named artifacts (10 pages).
                ARTIFACT_ID=""
                for PAGE in {1..10}; do
                  request "$API/artifacts?name=$ARTIFACT_NAME&per_page=100&page=$PAGE" "$DOWNLOAD_DIR/artifacts.json"
                  if ! jq -e '.artifacts | type == "array"' "$DOWNLOAD_DIR/artifacts.json" >/dev/null; then
                    echo "::error::GitHub returned an invalid artifact-list response."
                    exit 1
                  fi
                  COUNT=$(jq '.artifacts | length' "$DOWNLOAD_DIR/artifacts.json")
                  echo "Artifact page $PAGE: $COUNT entries (expired artifacts are excluded)."
                  jq -r --arg name "$ARTIFACT_NAME" '
                    .artifacts | sort_by(.created_at, .id) | reverse | .[] |
                    select(.name == $name and .expired == false) |
                    [.id // "missing", .workflow_run.id // "missing", .size_in_bytes // 0,
                     .created_at // "unknown", .expires_at // "unknown"] | @tsv
                  ' "$DOWNLOAD_DIR/artifacts.json" > "$DOWNLOAD_DIR/candidates"

                  while IFS=$'\t' read -r ID RUN_ID SIZE CREATED EXPIRES; do
                    echo "BI candidate: artifact=$ID run=$RUN_ID bytes=$SIZE created=$CREATED expires=$EXPIRES"
                    if [[ ! "$ID" =~ ^[0-9]+$ || ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
                      echo "Skipping artifact with missing or invalid artifact/run ID."
                      continue
                    fi
                    request "$API/runs/$RUN_ID" "$DOWNLOAD_DIR/run.json"
                    jq -r '"BI run: \(.html_url); workflow=\(.path); branch=\(.head_branch); sha=\(.head_sha); status=\(.status); conclusion=\(.conclusion)"' "$DOWNLOAD_DIR/run.json"
                    if jq -e '.path == ".github/workflows/ci.yml" and .status == "completed" and .conclusion == "success"' "$DOWNLOAD_DIR/run.json" >/dev/null; then
                      ARTIFACT_ID="$ID"
                      break
                    fi
                    echo "Skipping artifact: its producing BI CI run has not completed successfully."
                  done < "$DOWNLOAD_DIR/candidates"

                  if [[ -n "$ARTIFACT_ID" || "$COUNT" -lt 100 ]]; then
                    break
                  fi
                done

                if [[ -z "$ARTIFACT_ID" ]]; then
                  echo "::error::No unexpired '$ARTIFACT_NAME' artifact from a successful BI CI run was found in the searched pages. Rerun $REPO/.github/workflows/ci.yml to create one."
                  exit 1
                fi

                request "$API/artifacts/$ARTIFACT_ID/zip" "$DOWNLOAD_DIR/artifact.zip"
                if [[ ! -s "$DOWNLOAD_DIR/artifact.zip" ]]; then
                  echo "::error::BI artifact $ARTIFACT_ID downloaded as an empty file."
                  exit 1
                fi
                echo "Downloaded BI artifact $ARTIFACT_ID: $(wc -c < "$DOWNLOAD_DIR/artifact.zip") bytes."
                if ! unzip -tq "$DOWNLOAD_DIR/artifact.zip"; then
                  echo "::error::BI artifact $ARTIFACT_ID is not a valid ZIP archive."
                  exit 1
                fi
                mv "$DOWNLOAD_DIR/artifact.zip" artifact.zip

            - name: Move SEMOSS/bi to packages/legacy
              run: |
                unzip artifact.zip -d ./packages/legacy
                ls -als packages/legacy

            - name: Maven clean install
              run: |
                  /usr/share/maven/bin/mvn $MAVEN_CLI_OPTS clean install -Dci.version=${{ vars.VERSION }}-SNAPSHOT
                  rm -rf .m2/repository/org/semoss

            - name: Prepare artifact folder structure
              run: |
                mkdir -p semoss-ui-build/packages
                mkdir -p semoss-ui-build/packages/client
                mkdir -p semoss-ui-build/packages/playground
                mkdir -p semoss-ui-build/packages/terminal
                mkdir -p semoss-ui-build/packages/browser-automation
                cp -r packages/client/dist semoss-ui-build/packages/client
                cp -r packages/playground/dist semoss-ui-build/packages/playground
                cp -r packages/terminal/dist semoss-ui-build/packages/terminal
                cp -r packages/browser-automation/dist semoss-ui-build/packages/browser-automation
                cp -r packages/legacy semoss-ui-build/packages
                cp -r index.html semoss-ui-build/
            
            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                name: semoss-ui-build
                path: | 
                    semoss-ui-build/


            # - name: Save artifacts
            #   if: success()
            #   uses: actions/upload-artifact@v4
            #   with:
