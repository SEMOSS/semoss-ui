name: CI
on:
    push:
        branches:
            - dev
            - main
            - 776-update-frontend-build-tooling-and-node-version
    pull_request:
        branches:
            - dev
            - main
    workflow_dispatch:

env:
    MAVEN_OPTS: '-Dmaven.repo.local=.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true'
    MAVEN_CLI_OPTS: '-s ./settings.xml --batch-mode'
    FF_USE_FASTZIP: 'true'
    GPG_PASS_PHRASE: ${{ secrets.GPG_PASS_PHRASE }}
    RELEASE: ${{ vars.RELEASE }}
    MAVEN_REPO_TOKEN: ${{ vars.MAVEN_REPO_TOKEN }}
    MAVEN_REPO_TOKEN_PASS: ${{ vars.MAVEN_REPO_TOKEN_PASS }}
    MAVEN_CENTRAL_PORTAL_REPO_USERNAME: ${{ vars.MAVEN_CENTRAL_PORTAL_REPO_USERNAME }}
    MAVEN_CENTRAL_PORTAL_REPO_PASSWORD: ${{ vars.MAVEN_CENTRAL_PORTAL_REPO_PASSWORD }}
    
jobs:
    pnpm_build_dev:
        runs-on: self-hosted
        if: ${{ vars.RELEASE != 'TRUE'  && (github.event_name =='push' || github.event_name =='pull_request')  }}
        container:
            image: node:18.16.1-bullseye  #nvm image which can use multiple versions of node
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

              #install node 24 - set to node 24
              #pnpm install and build
              #download semoss bi - rename semoss bi to lagacy 
              #install and switch to node 18 
              #pnpm install and build 
              #copy legacy into semoss-ui/packages/legacy 

             # ---------- Build semoss-ui (Node 24) -----------                
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 10.13.1

            - name: Set up Node.js 24
              uses: actions/setup-node@v4
              with:
                node-version: '24'
                cache: "pnpm"

            #- name: Install pnpm
            #  run: npm install -g pnpm@10.13

            - name: Install dependencies and build (semoss-ui)
              run: |
                pnpm install
                pnpm run build

            # ---------- Download and Set Up semoss/bi -----------
            - name: Remove previous legacy folder
              run: rm -rf packages/legacy

            - name: Download SEMOSS/bi repository
              run: |
                mkdir -p tmp
                curl -L -u "${{ secrets.SEMOSS_GITHUB_USERNAME }}:${{ secrets.SEMOSS_GITHUB_PAT }}" -o tmp/main.zip https://github.com/SEMOSS/bi/archive/refs/heads/main.zip
                unzip tmp/main.zip -d tmp/
                rm tmp/main.zip

            - name: Move SEMOSS/bi to packages/legacy
              run: |
                mv tmp/bi-main ./packages/legacy
                rm -rf tmp/
            
