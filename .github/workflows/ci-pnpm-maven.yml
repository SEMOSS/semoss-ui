            #       echo "list files under legacy folder"
            #       ls -als legacy

            # ---------- Build SEMOSS/bi (Node 18) -----------
            - name: Set up Node.js 18 for SEMOSS/bi
              uses: actions/setup-node@v4
              with:
                node-version: '18'

            - name: Install pnpm in Node 18 session
              run: npm install -g pnpm@10.13

            - name: Install dependencies and build (SEMOSS/bi)
              working-directory: packages/legacy
              run: |
                pnpm install --ignore-workspace
                pnpm rebuild node-sass
                pnpm run build

            # - name: Cache node modules and Maven repository
            #   uses: actions/cache@v4
            #   with:
            #       path: |
            #           node_modules
            #           .m2/repository
            #           dist
            #           index.html
            #           .nx/cache
            #       key: ${{ github.ref_name }}

            # - name: Install dependencies
            #   run: |
            #       apt-get update
            #       apt-get install -y maven
            #       npm install -g pnpm@10.10
            #       pnpm install
            
            # # - name: Install nvm and node 24
            # #   run: |
            # #       curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
            # #       export NVM_DIR="$HOME/.nvm"
            # #       [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            # #       nvm install 24
            # #       nvm use 24
            # #       node --version

            # - name: Build
            #   env:
            #       NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
            #   run: npx nx run-many -t build -p @semoss/client @semoss/legacy

            - name: Maven clean install
              run: |
                  /usr/share/maven/bin/mvn $MAVEN_CLI_OPTS clean install -Dci.version=${{ vars.VERSION }}-SNAPSHOT
                  rm -rf .m2/repository/org/semoss

            # - name: Save artifacts
            #   if: success()
