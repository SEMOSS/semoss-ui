name: CI-node24
on:
    push:
        branches:
            - dev
            - main
            - 776-build-ci
    pull_request:
        branches:
            - dev
            - main
    workflow_dispatch:

env:
    MAVEN_OPTS: '-Dmaven.repo.local=.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true'
    MAVEN_CLI_OPTS: '-s ./settings.xml --batch-mode'
    FF_USE_FASTZIP: 'true'
    GPG_PASS_PHRASE: ${{ secrets.GPG_PASS_PHRASE }}
    RELEASE: ${{ vars.RELEASE }}
    MAVEN_REPO_TOKEN: ${{ vars.MAVEN_REPO_TOKEN }}
    MAVEN_REPO_TOKEN_PASS: ${{ vars.MAVEN_REPO_TOKEN_PASS }}
    MAVEN_CENTRAL_PORTAL_REPO_USERNAME: ${{ vars.MAVEN_CENTRAL_PORTAL_REPO_USERNAME }}
    MAVEN_CENTRAL_PORTAL_REPO_PASSWORD: ${{ vars.MAVEN_CENTRAL_PORTAL_REPO_PASSWORD }}

jobs:
    build_bi:
        runs-on: self-hosted
        if: (vars.RELEASE != 'TRUE' && (github.event_name == 'push' || github.event_name == 'pull_request')) || (vars.RELEASE != 'TRUE' && github.event_name == 'workflow_dispatch') || (vars.RELEASE == 'TRUE' && github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'dev'))
        container:
            image: node:18.16.1-bullseye
        steps:
            - name: Checkout BI code
              uses: actions/checkout@v4
              with:
                  repository: SEMOSS/bi
                  token: ${{ secrets.SEMOSS_GITHUB_PAT }}
                  path: bi
            
            - name: Cache node modules and Maven repository
              uses: actions/cache@v4
              with:
                  path: |
                      node_modules
                      .m2/repository
                      dist
                      index.html
                      .nx/cache
                  key: ${{ github.ref_name }}

            - name: Install pnpm
              run: npm install -g pnpm@10.10

            - name: Install BI dependencies
              working-directory: ./bi
              run: |
                  apt-get update
                  apt-get install -y maven
                  npm install -g pnpm@10.10
                  pnpm install
                  
            - name: BI build
              working-directory: ./bi
              run: pnpm run build

            - name: Upload BI artifact
              uses: actions/upload-artifact@v4
              with:
                  name: bi-dist
                  path: bi/dist

    pnpm_build_dev:
        needs: build_bi
        runs-on: self-hosted
        if: ${{ vars.RELEASE != 'TRUE'  && (github.event_name =='push' || github.event_name =='pull_request')  }}
        container:
            image: node:24-bullseye
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download BI artifact
              uses: actions/download-artifact@v4
              with:
                  name: bi-dist
                  path: bi-dist

            - name: Cache node modules and Maven repository
              uses: actions/cache@v4
              with:
                  path: |
                      node_modules
                      .m2/repository
                      dist
                      index.html
                      .nx/cache
                  key: ${{ github.ref_name }}

            - name: Install dependencies
              run: |
                  apt-get update
                  apt-get install -y maven
                  npm install -g pnpm@10.10
                  pnpm install

            - name: Build
              env:
                  NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
              run: npx nx run @semoss/client:build

            - name: Combine dists
              run: |
                  mkdir -p dist
                  cp -r packages/client/dist/* dist/
                  cp -r bi-dist/* dist/

            - name: Maven clean install
              run: |
                  /usr/share/maven/bin/mvn $MAVEN_CLI_OPTS clean install -Dci.version=${{ vars.VERSION }}-SNAPSHOT
                  rm -rf .m2/repository/org/semoss

    pnpm_build_deploy:
        needs: build_bi
        runs-on: self-hosted
        if: ${{ vars.RELEASE != 'TRUE'  && github.event_name =='workflow_dispatch' }}
        container:
            image: node:24-bullseye
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download BI artifact
              uses: actions/download-artifact@v4
              with:
                  name: bi-dist
                  path: bi-dist

            - name: Install dependencies
              run: |
                  echo "Event Name: ${{ github.event_name }}"
                  echo "Release: ${{ vars.RELEASE }}"
                  apt-get update
                  apt-get install -y maven
                  npm install -g pnpm@10.10
                  pnpm install

            - name: Build
              env:
                  NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
              run: npx nx run @semoss/client:build --verbose

            - name: Combine dists
              run: |
                  mkdir -p dist
                  cp -r packages/client/dist/* dist/
                  cp -r bi-dist/* dist/

            - name: Deploy with Maven
              shell: bash
              run: |
                  REF_NAME=$( echo $GITHUB_REF | sed 's|refs/heads/||')
                  if [[ "$REF_NAME" != 'dev' && "$REF_NAME" != 'main' ]]; then
                    mvn clean install -DfailIfNoTests=false -Dci.version=${{ vars.VERSION }}-SNAPSHOT
                  elif [[ "$REF_NAME" == 'dev' || "$REF_NAME" == 'main' ]]; then
                    mvn $MAVEN_CLI_OPTS deploy -P deploy -Dci.version=${{ vars.VERSION }}-SNAPSHOT
                  fi
              env:
                  GITHUB_REF: ${{ github.ref }}

            - name: Remove cache to save space
              run: rm -rf .m2/repository/org/semoss

            - name: Upload WAR to Nexus
              if: github.ref_name != 'dev' && github.ref_name != 'main'
              env:
                  NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
                  NEUXS_PASSWORD: ${{secrets.NEUXS_PASSWORD }}
                  GITHUB_REF: ${{ github.ref }}
              run: |
                  REF_NAME=$( echo $GITHUB_REF | sed 's|refs/heads/||')
                  WAR_FILE=$(ls target/*.war | head -n 1)
                  if [ -f "$WAR_FILE" ]; then
                    echo "Uploading WAR file: (basename $WAR_FILE)"
                    curl -v -u "$NEXUS_USERNAME:$NEUXS_PASSWORD" \
                    --upload-file "$WAR_FILE" \
                    "https://artifact.semoss.org/repository/semoss-ui-hosted-repo/$REF_NAME/$(basename $WAR_FILE)"
                  else
                    echo "No WAR file found in the target directory."
                  fi

    pnpm_build_release:
        needs: build_bi
        runs-on: self-hosted
        if: ${{ vars.RELEASE == 'TRUE' && github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'dev') }}
        container:
            image: node:24-bullseye
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download BI artifact
              uses: actions/download-artifact@v4
              with:
                  name: bi-dist
                  path: bi-dist

            - name: Install dependencies
              run: |
                  echo "Event Name: ${{ github.event_name }}"
                  echo "Release: ${{ vars.RELEASE }}"
                  apt-get update
                  apt-get install -y maven
                  npm install -g pnpm@10.10
                  pnpm install

            - name: Build
              env:
                  NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
              run: npx nx run @semoss/client:build --verbose

            - name: Combine dists
              run: |
                  mkdir -p dist
                  cp -r packages/client/dist/* dist/
                  cp -r bi-dist/* dist/

            - name: Deploy with Maven
              shell: bash
              run: |
                  mvn $MAVEN_CLI_OPTS deploy -P deploy -Dci.version=${{ vars.VERSION }}
              env:
                  GITHUB_REF: ${{ github.ref }}

            - name: Remove cache to save space
              run: rm -rf .m2/repository/org/semoss
