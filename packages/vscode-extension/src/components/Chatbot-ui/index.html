<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0, viewport-fit=cover, shrink-to-fit=no">
    <meta name="description" content="Semoss Chatbot Interface">
    <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <meta name="color-scheme" content="dark light">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Semoss Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <div id="container">
            <!-- Chat Container -->
            <div id="chat-container">
                <div id="chat-header">
                    <span id="chat-title">Chat</span>

                    <div class="header-buttons">
                        <button id="download-manual-btn" title="Download User Manual" aria-label="Download User Manual">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>
                        <button id="clear-chat-btn" title="Clear chat history" aria-label="Clear chat history">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="chat" role="log" aria-live="polite" aria-label="Chat messages"></div>
            </div>

            <!-- Start Area -->
            <div id="start-area">
                <div class="welcome-content">
                    <div class="welcome-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <h1 class="welcome-title">Welcome to Semoss Chatbot</h1>
                    <p class="welcome-subtitle">How can I help you today?</p>
                    <button id="start-btn" class="primary-button">
                        <span>Start</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Options Area -->
            <div id="options-area" class="options-container" style="display:none;" role="menu"></div>

            <!-- Input Area -->
            <div id="input-area"></div>
        </div>

        <!-- Loading Overlay -->
        <div id="loader" class="loader-overlay" style="display: none;">
            <div class="loader-content">
                <div class="spinner"></div>
                <div class="loader-text">Processing...</div>
            </div>
        </div>

        <!-- Toast Notifications -->
        <div id="toast-container" class="toast-container"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
