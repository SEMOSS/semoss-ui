<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Automation Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #333;
      margin-top: 0;
      font-size: 24px;
    }

    h2 {
      color: #555;
      font-size: 18px;
      margin-top: 30px;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f0f0f0;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #4285f4;
    }

    .help-text {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }

    button {
      background: #4285f4;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-right: 10px;
      margin-top: 10px;
    }

    button:hover {
      background: #357ae8;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    button.secondary {
      background: #f5f5f5;
      color: #555;
      border: 1px solid #ddd;
    }

    button.secondary:hover {
      background: #e8e8e8;
    }

    .status {
      padding: 12px;
      margin-top: 20px;
      border-radius: 4px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .project-section {
      display: none;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 2px solid #f0f0f0;
    }

    .project-section.show {
      display: block;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🔧 Browser Automation Settings</h1>

    <h2>🔐 Semoss Authentication</h2>
    <p class="help-text">Configure your Semoss credentials to save recordings</p>

    <div class="form-group">
      <label for="endpointUrl">Semoss Endpoint URL</label>
      <input type="text" id="endpointUrl" placeholder="http://localhost:9090/Monolith"
        value="http://localhost:9090/Monolith" />
      <div class="help-text">The URL of your Semoss instance</div>
    </div>

    <div class="form-group">
      <label for="clientKey">Client Key (Access Key)</label>
      <input type="text" id="clientKey" placeholder="Your client key from Semoss" />
      <div class="help-text">Get this from Semoss Settings → API Keys</div>
    </div>

    <div class="form-group">
      <label for="secretKey">Secret Key</label>
      <input type="password" id="secretKey" placeholder="Your secret key from Semoss" />
      <div class="help-text">Get this from Semoss Settings → API Keys</div>
    </div>

    <div class="btn-row">
      <button id="testConnection">Test Connection</button>
      <button id="saveSettings" class="secondary">Save Settings</button>
    </div>

    <div id="authStatus" class="status"></div>
  </div>

  <script type="module" src="./options.ts"></script>
</body>

</html>
