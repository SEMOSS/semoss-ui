<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Automation Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      margin-top: 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #4285f4;
    }
    .help-text {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
    button {
      background: #4285f4;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-right: 10px;
    }
    button:hover {
      background: #357ae8;
    }
    button.secondary {
      background: #f5f5f5;
      color: #555;
      border: 1px solid #ddd;
    }
    button.secondary:hover {
      background: #e8e8e8;
    }
    .status {
      padding: 12px;
      margin-top: 20px;
      border-radius: 4px;
      display: none;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Browser Automation Settings</h1>
    
    <form id="settings-form">
      <div class="form-group">
        <label for="endpoint">Workshop Endpoint</label>
        <input 
          type="text" 
          id="endpoint" 
          placeholder="https://workshop.cfg.deloitte.com/cfg-ai-demo"
          required
        />
        <div class="help-text">The base URL of your Workshop platform instance</div>
      </div>

      <div class="form-group">
        <label for="module">Module Path</label>
        <input 
          type="text" 
          id="module" 
          placeholder="/Monolith"
          value="/Monolith"
        />
        <div class="help-text">The module path (usually /Monolith)</div>
      </div>

      <div class="form-group">
        <label for="modelId">LLM Model ID</label>
        <input 
          type="text" 
          id="modelId" 
          placeholder="Enter model ID"
          required
        />
        <div class="help-text">The LLM engine/model ID to use (leave empty to use default)</div>
      </div>

      <div class="form-group">
        <label for="accessKey">Access Key</label>
        <input 
          type="text" 
          id="accessKey" 
          placeholder="your-access-key"
          required
        />
        <div class="help-text">Access key generated by Workshop server</div>
      </div>

      <div class="form-group">
        <label for="secretKey">Secret Key</label>
        <input 
          type="password" 
          id="secretKey" 
          placeholder="your-secret-key"
          required
        />
        <div class="help-text">Secret key generated by Workshop server</div>
      </div>

      <div>
        <button type="submit">Save Settings</button>
        <button type="button" class="secondary" id="test-btn">Test Connection</button>
      </div>
    </form>

    <div id="status" class="status"></div>
  </div>

  <script type="module" src="./options.js"></script>
</body>
</html>
