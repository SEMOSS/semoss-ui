# Packages the built app (out/) for each platform. Signing and notarization come
# only from the environment (CSC_LINK / CSC_KEY_PASSWORD, APPLE_ID /
# APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID, WIN_CSC_LINK); without them the
# builds are unsigned, which is fine for local use.
appId: org.semoss.chat
productName: SEMOSS Chat
# names every installer by its architecture, so testers pick the right one
artifactName: SEMOSS-Chat-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
asar: true
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  target:
    - AppImage
  category: Office
