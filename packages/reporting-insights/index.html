<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Never cache the app shell: it references hashed JS/CSS, so a stale index.html
         silently pins an old bundle (a recurring source of "my fix didn't take effect",
         especially inside the playground tool iframe). Assets remain cacheable via hash. -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>reporting-insights</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
